[project]
name = "durable-workflow-scheduler-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli = false

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
